<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOB Saturday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#F5F6F1;
  --surface:#FFFFFF;
  --ink:#1B2620;
  --muted:#5E6B63;
  --line:#DCE0D6;
  --pine:#1E3A2B;
  --pine-ink:#F5F6F1;
  --sand:#D8C79E;
  --sand-soft:#F1EADA;
  --flag:#B3261E;
  --best:#1E3A2B;
  --best-ink:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#121915; --surface:#1A231E; --ink:#E7EBE4; --muted:#9AA79F; --line:#2C3830;
    --pine:#2F5A43; --pine-ink:#F0F3EE; --sand:#B9A77A; --sand-soft:#2A2A20;
    --flag:#E2665C; --best:#C9B37E; --best-ink:#141A16;
    --t-dente:#6FAE88; --t-kraft:#7FA6D6; --t-flores:#D98394; --t-fuentes:#D9AE55;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121915; --surface:#1A231E; --ink:#E7EBE4; --muted:#9AA79F; --line:#2C3830;
  --pine:#2F5A43; --pine-ink:#F0F3EE; --sand:#B9A77A; --sand-soft:#2A2A20;
  --flag:#E2665C; --best:#C9B37E; --best-ink:#141A16;
  --t-dente:#6FAE88; --t-kraft:#7FA6D6; --t-flores:#D98394; --t-fuentes:#D9AE55;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--pine)}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--flag);outline-offset:2px}

header{background:var(--pine);color:var(--pine-ink);padding:20px 18px 0;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.title{font-family:'Libre Caslon Text',Georgia,serif;font-weight:700;font-size:26px;letter-spacing:-.01em;line-height:1.1}
.title small{display:block;font-family:'IBM Plex Sans',sans-serif;font-weight:400;font-size:13px;opacity:.75;margin-top:4px;letter-spacing:0}
.courses{display:flex;gap:4px;margin-top:16px}
.course-btn{flex:1;background:transparent;border:0;border-bottom:3px solid transparent;color:var(--pine-ink);opacity:.65;padding:10px 4px 9px;cursor:pointer;font-family:'Libre Caslon Text',Georgia,serif;font-size:17px}
.course-btn[aria-pressed="true"]{opacity:1;border-bottom-color:var(--sand)}
.course-btn span{display:block;font-family:'IBM Plex Sans',sans-serif;font-size:11px;opacity:.8}

nav.views{display:flex;gap:6px;padding:12px 16px;overflow-x:auto;background:var(--bg);border-bottom:1px solid var(--line)}
.view-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.view-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

main{max-width:760px;margin:0 auto;padding:18px 16px 40px}
h2{font-family:'Libre Caslon Text',Georgia,serif;font-size:21px;font-weight:700;margin-bottom:4px}
.lede{color:var(--muted);font-size:14px;margin-bottom:16px;max-width:60ch}

/* Leaderboard: manual scoreboard */
.board{background:var(--surface);border:2px solid var(--ink);border-radius:4px;overflow:hidden}
.board-row{display:grid;grid-template-columns:44px 1fr 58px 50px 58px;align-items:center;border-top:1px solid var(--line)}
.board-row:first-child{border-top:0}
.board-head{background:var(--ink);color:var(--bg);font-size:12px;font-weight:600}
.board-head > div{padding:8px 6px;text-align:center}
.board-head > div:nth-child(2){text-align:left}
.pos{font-family:'Libre Caslon Text',Georgia,serif;font-size:20px;font-weight:700;text-align:center}
.team-cell{padding:12px 6px;display:flex;align-items:center;gap:10px;min-width:0}
.swatch{width:6px;align-self:stretch;border-radius:2px;flex-shrink:0}
.team-name{font-weight:600;font-size:16px}
.thru{font-size:12px;color:var(--muted)}
.tile{margin:6px 4px;background:var(--sand-soft);border:1px solid var(--line);border-radius:3px;text-align:center;padding:7px 0;font-weight:600;font-size:16px}
.tile.net{background:var(--pine);color:var(--pine-ink);border-color:var(--pine);font-family:'Libre Caslon Text',Georgia,serif;font-size:20px;font-weight:700}
.tile.empty{color:var(--muted);font-weight:400}
.board-note{font-size:13px;color:var(--muted);margin-top:10px}

/* Totals across rounds */
.totals{margin-top:26px}
table{border-collapse:collapse;width:100%}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.tbl th,.tbl td{padding:9px 8px;text-align:center;border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap}
.tbl th{font-size:12px;color:var(--muted);font-weight:600;background:var(--bg)}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.tbl tr:last-child td{border-bottom:0}
.tbl .strong{font-weight:700}

/* Score entry */
.team-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.team-pick button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 4px;font-weight:600;font-size:14px;cursor:pointer;border-top:4px solid var(--tc)}
.team-pick button[aria-pressed="true"]{background:var(--tc);color:#fff;border-color:var(--tc)}
:root[data-theme="dark"] .team-pick button[aria-pressed="true"]{color:#141A16}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .team-pick button[aria-pressed="true"]{color:#141A16}}

.hole-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.hole-num{font-family:'Libre Caslon Text',Georgia,serif;font-size:30px;font-weight:700;line-height:1}
.hole-num small{display:block;font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:500;color:var(--muted);margin-top:4px}
.arrow{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;cursor:pointer}
.arrow:disabled{opacity:.35;cursor:default}
.holes-strip{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-bottom:16px}
.hs{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:5px 0;font-size:12px;font-weight:600;cursor:pointer;text-align:center}
.hs.done{background:var(--sand-soft);border-color:var(--sand)}
.hs[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.players{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.prow{display:grid;grid-template-columns:1fr auto;align-items:center;padding:10px 12px;border-top:1px solid var(--line);gap:8px}
.prow:first-child{border-top:0}
.pname{font-weight:600}
.pmeta{font-size:12px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:20px;cursor:pointer;line-height:1}
.score{width:44px;height:44px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;border:2px solid var(--line);background:var(--bg)}
.score.is-best{background:var(--best);color:var(--best-ink);border-color:var(--best)}
.score.blank{color:var(--muted);font-weight:400}
.hole-total{display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--sand-soft);border-top:1px solid var(--line);border-radius:0 0 8px 8px;font-weight:600}
.hole-total strong{font-size:22px;font-family:'Libre Caslon Text',Georgia,serif}
.hint{font-size:13px;color:var(--muted);margin-top:10px}
.clear-btn{margin-top:12px;border:1px solid var(--line);background:transparent;border-radius:6px;padding:8px 12px;font-size:13px;cursor:pointer;color:var(--muted)}

/* Scorecard grid */
.card .tbl th,.card .tbl td{padding:7px 6px;font-size:13px;min-width:30px}
.card td.b{background:var(--best);color:var(--best-ink);font-weight:700}
.card tr.sum td{font-weight:700;background:var(--sand-soft)}
.card td.out{border-left:2px solid var(--line)}
.card-team{margin-bottom:22px}
.card-team h3{font-size:16px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.card-team h3 i{width:12px;height:12px;border-radius:2px;display:inline-block}
.card-foot{font-size:13px;color:var(--muted);margin-top:6px}

/* Handicaps */
.hcp-team{margin-bottom:22px}
.hcp-team h3{font-size:16px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.hcp-team h3 i{width:12px;height:12px;border-radius:2px;display:inline-block}
.tbl tr.allow td{background:var(--pine);color:var(--pine-ink);font-weight:700}
.rules{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--sand);border-radius:6px;padding:14px 16px;margin-bottom:20px;font-size:14px}
.rules p+p{margin-top:6px}
.sync{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;font-weight:600;background:rgba(255,255,255,.12);padding:4px 10px;border-radius:999px}
.sync i{width:8px;height:8px;border-radius:50%;background:#C9B37E}
.sync.live i{background:#5BD08A}
.sync.error i{background:#FF7A6E}
.skin-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.skin-sum div{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;text-align:center}
.skin-sum b{display:block;font-family:'Libre Caslon Text',Georgia,serif;font-size:22px}
.skin-sum span{font-size:12px;color:var(--muted)}
.skins{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:22px}
.skin-row{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.skin-row:first-child{border-top:0}
.skin-hole{font-family:'Libre Caslon Text',Georgia,serif;font-size:20px;font-weight:700;line-height:1}
.skin-hole small{display:block;font-family:'IBM Plex Sans',sans-serif;font-size:11px;font-weight:500;color:var(--muted);margin-top:3px}
.skin-who{font-weight:600}
.skin-detail{font-size:12px;color:var(--muted)}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.tag.won{background:var(--pine);color:var(--pine-ink)}
.tag.dead{background:var(--sand-soft);color:var(--muted);border:1px solid var(--line)}
.tag.live{border:1px dashed var(--muted);color:var(--muted)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--flag);margin-left:3px;vertical-align:middle}
[hidden]{display:none!important}
@media (prefers-reduced-motion: no-preference){.score{transition:background .15s,color .15s}}

.tee{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;line-height:1.5;vertical-align:1px}
.tee-blue{background:linear-gradient(135deg,#2980b9,#1a5276);color:#fff}
.tee-white{background:linear-gradient(135deg,#ecf0f1,#bdc3c7);color:#1B2620}
.tee-green{background:#D5F5E3;color:#1E8449;border:.5px solid #A9DFBF}
.tee-gold{background:#FEF3C7;color:#92400E;border:.5px solid #FCD34D}
.hc-lo{color:#27ae60;font-weight:700}.hc-mid{color:#e67e22;font-weight:700}.hc-hi{color:#e74c3c;font-weight:700}
.board-row{grid-template-columns:44px 1fr 54px 46px 58px}
.group-pick{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:14px}
.group-pick button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:10px 8px;text-align:left;cursor:pointer;font-weight:600;font-size:14px}
.group-pick button[aria-pressed="true"]{background:var(--pine);color:var(--pine-ink);border-color:var(--pine)}
.go-btn{width:100%;border:0;background:var(--ink);color:var(--bg);border-radius:6px;padding:12px;font-weight:600;font-size:15px;cursor:pointer}
.go-btn:disabled{opacity:.4;cursor:default}
.group-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;font-size:13px;color:var(--muted)}
.link-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.pts{font-size:12px;color:var(--muted);text-align:center;min-width:44px}
.pts b{display:block;font-size:15px;color:var(--ink)}
.card td sup{font-size:9px;color:var(--flag);margin-left:1px}
.card td.b sup{color:inherit}
.sc{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;box-sizing:border-box;line-height:1}
.sc.birdie,.sc.eagle{border:1.5px solid currentColor;border-radius:50%}
.sc.bogey,.sc.dbl{border:1.5px solid currentColor;border-radius:1px}
.sc.eagle,.sc.dbl{outline:1.5px solid currentColor;outline-offset:1.5px}
.card td .sc{margin:3px 1px}
.score .sc{width:32px;height:32px}
.score .sc.eagle,.score .sc.dbl{width:28px;height:28px;outline-offset:2px}
.pname-btn{border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.pname-btn::after{content:" \25BE";font-size:11px;color:var(--muted)}
.pname-btn[aria-expanded="true"]::after{content:" \25B4"}
.mini{grid-column:1/-1;padding:4px 6px 12px}
.mini table{border-collapse:collapse;width:100%;font-size:12px;text-align:center}
.mini th{font-weight:500;color:var(--muted);padding:2px 0}
.mini td{padding:1px 0}
.mini td.b{background:var(--sand-soft)}
.mini .lbl{text-align:left;color:var(--muted);font-weight:500;padding-right:4px;width:34px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin:-4px 0 12px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .sc{width:18px;height:18px;font-size:10px;color:var(--ink);font-style:normal}

.tee-black{background:#1B2620;color:#fff;border:.5px solid #555}
.setup-card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:16px}
.setup-card h3{margin:0 0 10px;font-size:15px}
.srow{display:grid;grid-template-columns:1fr 84px 58px 34px;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.setup-card input,.setup-card select{font:inherit;font-size:15px;padding:8px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box;min-width:0}
.icon-btn{border:1px solid var(--line);background:var(--bg);border-radius:5px;height:38px;cursor:pointer;color:var(--flag);font-size:16px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sbtn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;color:var(--ink)}
.sbtn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sbtn.danger{color:var(--flag)}
.smsg{font-size:13px;color:var(--muted);margin-top:8px}
.smsg.ok{color:#1E8449}.smsg.bad{color:var(--flag)}
.pin-box{display:flex;gap:8px;max-width:300px}
</style>
</head>
<body>
<header>
  <div class="title">SOB Saturday<small id="subtitle">Braelinn Country Club.</small></div>
  <div id="sync" class="sync" role="status"><i></i><span>Connecting…</span></div>
  <div style="height:14px"></div>
</header>
<nav class="views" role="group" aria-label="View">
  <button class="view-btn" data-v="board" aria-pressed="true">Leaderboard</button>
  <button class="view-btn" data-v="enter" aria-pressed="false">Enter scores</button>
  <button class="view-btn" data-v="card" aria-pressed="false">Scorecard</button>
  <button class="view-btn" data-v="skins" aria-pressed="false">Skins</button>
  <button class="view-btn" data-v="hcp" aria-pressed="false">Handicaps</button>
  <button class="view-btn" data-v="setup" aria-pressed="false">Setup</button>
</nav>
<main>
  <section id="v-board"></section>
  <section id="v-enter" hidden></section>
  <section id="v-card" hidden></section>
  <section id="v-skins" hidden></section>
  <section id="v-hcp" hidden></section>
  <section id="v-setup" hidden></section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ===== PASTE YOUR TWO SUPABASE VALUES HERE (same ones as before) =====
const SUPABASE_URL = "https://skqixupmbhqoxruhimwx.supabase.co";
const SUPABASE_KEY = "sb_publishable_fvbUP_gX-XEWG7cFi8WwPg_mKKF_AK4";
// ===== PIN for the Setup tab — change to your own =====
const ADMIN_PIN = "3258";
// ======================================================================
const TABLE = "pinehurst_scores";     // scores
const ROSTER = "event_players";       // players
const SETTINGS = "event_settings";    // format
const FORMATS = {
  stableford: {label:"Stableford (net)",  short:"Individual net Stableford plus skins."},
  net:        {label:"Stroke play (net)",  short:"Individual net stroke play plus skins."},
  gross:      {label:"Stroke play (gross)",short:"Individual gross stroke play plus skins."},
};
const EVENT = "sob", EVENT_COURSE = 100, EVENT_TEAM = "sob";

// Players live in Supabase and are managed in the Setup tab
const DEFAULT_PLAYERS = [];

// Braelinn CC scorecard, men's handicap row
const PAR = [5,4,4,3,4,3,5,4,4, 5,3,4,4,3,4,4,5,4];
const SI  = [1,5,9,17,15,11,13,3,7, 6,14,16,4,10,18,12,8,2];
const TEES = {
  Black: {r:"71.8 / 134", y:[554,420,358,182,351,188,517,415,394, 512,174,380,406,184,317,369,544,420]},
  Blue:  {r:"70.3 / 130", y:[533,403,343,169,335,176,493,385,378, 488,159,351,390,161,302,354,528,404]},
  White: {r:"68.8 / 127", y:[507,387,328,144,319,160,483,359,362, 478,144,320,374,152,287,339,512,388]},
  Green: {r:"65.0 / 119", y:[458,282,286,120,272,137,433,279,318, 446,128,275,318,130,240,297,439,335]},
  Gold:  {r:"62.3 / 113", y:[383,270,277,115,225,132,375,271,262, 384,124,263,312,125,229,237,430,299]},
};
const TEE_NAMES = Object.keys(TEES);

// Stableford: full handicap, hardest holes first, 2nd stroke over 18
const strokesFull = (h, si) => Math.floor(h/18) + (si <= h % 18 ? 1 : 0);
// Skins: capped at 18, so never more than one stroke a hole
const strokesSkin = (h, si) => si <= Math.min(h, 18) ? 1 : 0;
const POINTS = d => d <= -2 ? 4 : d === -1 ? 3 : d === 0 ? 2 : d === 1 ? 1 : 0;

const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const teeBadge = t => `<span class="tee tee-${String(t).toLowerCase()}">${esc(t)}</span>`;
const hcClass = h => h <= 9 ? "hc-lo" : h <= 15 ? "hc-mid" : "hc-hi";

// Traditional scorecard marks, based on gross vs par
function scClass(g, h){
  if(g === null || g === 0) return "";
  const d = g - PAR[h];
  return d <= -2 ? "eagle" : d === -1 ? "birdie" : d === 0 ? "" : d === 1 ? "bogey" : "dbl";
}
const scMark = (g, h) => g === null ? "" : g === 0 ? "P" : `<span class="sc ${scClass(g,h)}">${g}</span>`;
const LEGEND = `<div class="legend"><span><i class="sc eagle">3</i>Eagle+</span><span><i class="sc birdie">3</i>Birdie</span><span><i class="sc bogey">5</i>Bogey</span><span><i class="sc dbl">6</i>Double+</span></div>`;

// ---- local storage helpers ----
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch(e){ return d; } };
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };

// ---- state ----
const LIVE = SUPABASE_URL.startsWith("https://") && !SUPABASE_KEY.startsWith("PASTE") && !!window.supabase;
const KEY = LIVE ? "sob-sat-live-cache-v2" : "sob-sat-v2";
let scores = load(KEY, {});                 // scores[pid][hole] = gross (0 = pickup)
let roster = load("sob-roster-v2", null) || DEFAULT_PLAYERS.map(p => ({...p, active:true}));
let rosterState = LIVE ? "loading" : "local"; // loading | ok | empty | missing | local
let group = load("sob-sat-group-v2", []);
let picking = !group.length;
let admin = load("sob-admin", false);
let view = "board", hole = 0, openP = null;
let fmt = load("sob-fmt", "stableford"); if(!FORMATS[fmt]) fmt = "stableford";
const isSF = () => fmt === "stableford";
const toPar = n => n === 0 ? "E" : (n > 0 ? "+" + n : String(n));
let setupMsg = {test:"", clear:"", add:""};

const saveScores = () => store(KEY, scores);
const saveRosterLocal = () => store("sob-roster-v2", roster);
const active = () => roster.filter(r => r.active).sort((a,b) => a.pid - b.pid);
const byPid = pid => roster.find(r => r.pid === pid);
const getS = (p,h) => scores?.[p]?.[h] ?? null;
function shortName(pl){
  const last = pl.n.trim().split(/\s+/).pop();
  const dup = active().filter(x => x.n.trim().split(/\s+/).pop() === last).length > 1;
  return last + (dup ? " " + pl.n.trim()[0] : "");
}

// ---- live sync: scores ----
function applyLocal(p,h,v){
  scores[p] ??= {};
  if(v === null) delete scores[p][h]; else scores[p][h] = v;
  saveScores();
}
const pending = {};
const pkey = (p,h) => p + "|" + h;
let db = null;
function setStatus(state){
  const box = document.getElementById("sync");
  const text = {live:"Live — syncing all phones", connecting:"Connecting…", error:"Offline — retrying", local:"Device only — keys not added"}[state];
  box.className = "sync " + state;
  box.querySelector("span").textContent = text;
}
function setS(p,h,v){
  applyLocal(p,h,v);
  if(!LIVE) return;
  const k = pkey(p,h);
  if(pending[k]) clearTimeout(pending[k].timer);
  pending[k] = {v, timer: setTimeout(() => pushScore(p,h,v,k), 350)};
}
async function pushScore(p,h,v,k){
  try{
    const row = {course:EVENT_COURSE, team:EVENT_TEAM, player:p, hole:h};
    const {error} = v === null
      ? await db.from(TABLE).delete().match(row)
      : await db.from(TABLE).upsert({...row, gross:v, updated_at:new Date().toISOString()});
    if(error) throw error;
    if(pending[k] && pending[k].v === v) delete pending[k];
    setStatus("live");
  }catch(e){
    setStatus("error");
    if(pending[k]) pending[k].timer = setTimeout(() => pushScore(p,h,pending[k].v,k), 3000);
  }
}

// ---- live sync: roster ----
const fromRow = r => ({pid:r.pid, n:r.name, tee:r.tee, h:r.hcp, active:r.active});
async function pushPlayer(pl){
  saveRosterLocal();
  if(!LIVE) return true;
  const {error} = await db.from(ROSTER).upsert({event:EVENT, pid:pl.pid, name:pl.n, tee:pl.tee, hcp:pl.h, active:pl.active, updated_at:new Date().toISOString()});
  if(error){ setupMsg.add = "Couldn’t save to the roster table. Run the roster setup SQL, then try again."; render(); return false; }
  return true;
}

async function pushFormat(v){
  fmt = v; store("sob-fmt", v); render();
  if(!LIVE) return;
  const {error} = await db.from(SETTINGS).upsert({event:EVENT, format:v, updated_at:new Date().toISOString()});
  if(error){ setupMsg.fmt = "Couldn’t save the format. Run the setup SQL, then try again."; render(); }
  else { setupMsg.fmt = ""; }
}
async function loadAll(){
  const st = await db.from(SETTINGS).select("format").eq("event", EVENT);
  if(!st.error && st.data.length && FORMATS[st.data[0].format]){ fmt = st.data[0].format; store("sob-fmt", fmt); }
  const [sc, ro] = await Promise.all([
    db.from(TABLE).select("player,hole,gross").eq("course", EVENT_COURSE).eq("team", EVENT_TEAM),
    db.from(ROSTER).select("pid,name,tee,hcp,active").eq("event", EVENT),
  ]);
  if(ro.error) rosterState = "missing";
  else if(!ro.data.length){ roster = []; rosterState = "empty"; saveRosterLocal(); }
  else { roster = ro.data.map(fromRow); rosterState = "ok"; saveRosterLocal(); }
  if(sc.error){ setStatus("error"); render(); return; }
  const keep = Object.entries(pending).map(([k,x]) => [k.split("|"), x.v]);
  scores = {};
  sc.data.forEach(r => applyLocal(r.player, r.hole, r.gross));
  keep.forEach(([[p,h], v]) => applyLocal(+p, +h, v));
  setStatus("live");
  render();
}
function startSync(){
  if(!LIVE){ setStatus("local"); return; }
  setStatus("connecting");
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  db.channel("sob-saturday-live")
    .on("postgres_changes", {event:"*", schema:"public", table:TABLE}, payload => {
      if(payload.eventType === "DELETE"){ loadAll(); return; }
      const r = payload.new;
      if(r.course !== EVENT_COURSE || r.team !== EVENT_TEAM) return;
      if(pending[pkey(r.player, r.hole)]) return;
      applyLocal(r.player, r.hole, r.gross);
      render();
    })
    .on("postgres_changes", {event:"*", schema:"public", table:SETTINGS}, payload => {
      const r = payload.new;
      if(!r || r.event !== EVENT || !FORMATS[r.format]) return;
      fmt = r.format; store("sob-fmt", fmt); render();
    })
    .on("postgres_changes", {event:"*", schema:"public", table:ROSTER}, payload => {
      const r = payload.new;
      if(!r || r.event !== EVENT) return;
      const pl = fromRow(r), i = roster.findIndex(x => x.pid === pl.pid);
      if(i >= 0) roster[i] = pl; else roster.push(pl);
      rosterState = "ok"; saveRosterLocal(); render();
    })
    .subscribe(status => {
      if(status === "SUBSCRIBED") loadAll();
      else if(["CHANNEL_ERROR","TIMED_OUT","CLOSED"].includes(status)) setStatus("error");
    });
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") loadAll(); });
  setInterval(() => { if(document.visibilityState === "visible") loadAll(); }, 30000);
}

// ---- scoring ----
function holePts(p,h){
  const g = getS(p,h), pl = byPid(p);
  if(g === null || !pl) return null;
  if(g === 0) return 0;
  return POINTS(g - strokesFull(pl.h, SI[h]) - PAR[h]);
}
// Pickup counts as net double bogey for the gross total
const grossFor = (p,h) => { const g = getS(p,h); return g === 0 ? PAR[h] + 2 + strokesFull(byPid(p).h, SI[h]) : g; };
const netFor = (p,h) => grossFor(p,h) - strokesFull(byPid(p).h, SI[h]);
function summary(p){
  let pts = 0, gross = 0, thru = 0, pu = 0, gtp = 0, ntp = 0;
  for(let h=0; h<18; h++){
    const g = getS(p,h); if(g === null) continue;
    thru++; pts += holePts(p,h); gross += grossFor(p,h); if(g === 0) pu++;
    gtp += grossFor(p,h) - PAR[h]; ntp += netFor(p,h) - PAR[h];
  }
  return {pts, gross, thru, pu, gtp, ntp};
}
// What the leaderboard ranks on, and how it's shown
const rankVal = r => isSF() ? -r.pts : fmt === "net" ? r.ntp : r.gtp;
const mainVal = r => isSF() ? r.pts : toPar(fmt === "net" ? r.ntp : r.gtp);
const mainHead = () => isSF() ? "Pts" : fmt === "net" ? "Net" : "Gross";

const el = id => document.getElementById(id);

function miniCard(p){
  const pl = byPid(p);
  const half = (a) => {
    const hs = Array.from({length:9},(_,i)=>a+i);
    return `<tr><th class="lbl">Hole</th>${hs.map(h=>`<th>${h+1}</th>`).join("")}</tr>
      <tr><th class="lbl">Par</th>${hs.map(h=>`<th>${PAR[h]}</th>`).join("")}</tr>
      <tr><td class="lbl">Score</td>${hs.map(h=>{const pts=holePts(p,h);return `<td class="${pts!==null&&pts>=3?"b":""}">${scMark(getS(p,h),h)}</td>`;}).join("")}</tr>
      <tr><td class="lbl">${isSF() ? "Pts" : "Net"}</td>${hs.map(h=>{ if(getS(p,h)===null) return "<td></td>"; return `<td>${isSF() ? holePts(p,h) : netFor(p,h)}</td>`;}).join("")}</tr>`;
  };
  return `<div class="mini" role="region" aria-label="${esc(pl.n)} hole by hole"><table>${half(0)}</table><div style="height:8px"></div><table>${half(9)}</table></div>`;
}

function renderBoard(){
  const rows = active().map(pl => ({p:pl.pid, pl, ...summary(pl.pid)}));
  rows.sort((a,b) => (!!b.thru - !!a.thru) || rankVal(a) - rankVal(b) || b.thru - a.thru || a.pl.n.localeCompare(b.pl.n));
  const pos = rows.map(r => {
    if(!r.thru) return "";
    const first = rows.findIndex(x => x.thru && rankVal(x) === rankVal(r));
    const tied = rows.filter(x => x.thru && rankVal(x) === rankVal(r)).length > 1;
    return (tied ? "T" : "") + (first + 1);
  });
  const any = rows.some(r => r.thru);
  el("v-board").innerHTML = `
    <h2>Leaderboard</h2>
    <p class="lede">${isSF() ? "Net Stableford at full handicap: eagle or better 4, birdie 3, par 2, bogey 1, double or worse 0. Most points wins."
      : fmt === "net" ? "Net stroke play at full handicap. Lowest net score to par wins."
      : "Gross stroke play. Lowest score to par wins."} Tap a name for their card.</p>
    <div class="board" role="table" aria-label="Leaderboard">
      <div class="board-row board-head" role="row"><div>Pos</div><div>Player</div><div>Gross</div><div>Hcp</div><div>${mainHead()}</div></div>
      ${rows.map((r,i) => `
        <div class="board-row" role="row">
          <div class="pos">${pos[i] || "–"}</div>
          <div class="team-cell"><div style="min-width:0">
            <div class="team-name"><button class="pname-btn" data-open="${r.p}" aria-expanded="${openP===r.p}">${esc(r.pl.n)}</button></div>
            <div class="thru">${teeBadge(r.pl.tee)} ${r.thru === 18 ? "Finished" : r.thru === 0 ? "Not started" : "Thru " + r.thru}</div></div></div>
          <div class="tile ${r.thru ? "" : "empty"}">${r.thru ? r.gross + (r.pu ? "*" : "") : "–"}</div>
          <div class="tile">${r.pl.h}</div>
          <div class="tile net ${r.thru ? "" : "empty"}">${r.thru ? mainVal(r) : "–"}</div>
          ${openP === r.p ? miniCard(r.p) : ""}
        </div>`).join("")}
    </div>
    <p class="board-note">${any ? "* Includes a pickup, counted as net double bogey." : "No scores yet. Open Enter scores, pick your group and start posting holes."}${!isSF() && any ? " Scores to par are for holes played so far." : ""}</p>`;
}

function renderEnter(){
  const g = group.filter(pid => byPid(pid)?.active);
  if(picking || !g.length){
    el("v-enter").innerHTML = `
      <h2>Pick your group</h2>
      <p class="lede">Choose the players you’re scoring for. This phone remembers them.</p>
      <div class="group-pick" role="group" aria-label="Players">
        ${active().map(pl => `<button data-gp="${pl.pid}" aria-pressed="${group.includes(pl.pid)}">${esc(pl.n)}</button>`).join("")}
      </div>
      <button class="go-btn" data-go="1" ${g.length ? "" : "disabled"}>Score ${g.length || ""} player${g.length === 1 ? "" : "s"}</button>`;
    return;
  }
  const doneHole = h => g.every(p => getS(p,h) !== null);
  const holePtsSum = g.reduce((s,p) => s + (holePts(p,hole) ?? 0), 0);
  el("v-enter").innerHTML = `
    <div class="group-bar"><span>Scoring ${g.length} player${g.length === 1 ? "" : "s"}</span><button class="link-btn" data-pick="1">Change group</button></div>
    <div class="hole-bar">
      <button class="arrow" data-step="-1" aria-label="Previous hole" ${hole===0?"disabled":""}>‹</button>

      <button class="arrow" data-step="1" aria-label="Next hole" ${hole===17?"disabled":""}>›</button>
    </div>
    <div class="holes-strip" aria-label="Jump to hole">
      ${Array.from({length:18},(_,h) => `<button class="hs ${doneHole(h)?"done":""}" data-hole="${h}" aria-current="${h===hole}">${h+1}</button>`).join("")}
    </div>
    <div class="players">
      ${g.map(p => {
        const pl = byPid(p), v = getS(p,hole), pts = holePts(p,hole);
        const k = strokesFull(pl.h, SI[hole]), ks = strokesSkin(pl.h, SI[hole]);
        const meta = `${teeBadge(pl.tee)} Hcp ${pl.h}${k ? `, stroke${k>1?"s":""} ${'<span class="dot"></span>'.repeat(k)}` : ""}${k > ks ? " (1 for skins)" : ""}`;
        return `<div class="prow">
          <div><div class="pname">${esc(pl.n)}</div><div class="pmeta">${meta}</div></div>
          <div class="stepper">
            <button data-p="${p}" data-d="-1" aria-label="Lower ${esc(pl.n)} score">−</button>
            <div class="score ${v===null?"blank":""} ${pts!==null&&pts>=3?"is-best":""}" aria-live="polite" aria-label="${esc(pl.n)} score">${v===null?"–":scMark(v,hole)}</div>
            <button data-p="${p}" data-d="1" aria-label="Raise ${esc(pl.n)} score">+</button>
            <div class="pts">${isSF() ? `<b>${pts===null?"–":pts}</b>pts` : `<b>${v===null?"–":netFor(p,hole)}</b>net`}</div>
          </div>
        </div>`;
      }).join("")}
      ${isSF() ? `<div class="hole-total"><span>Group points on hole ${hole+1}</span><strong>${g.some(p => getS(p,hole)!==null) ? holePtsSum : "–"}</strong></div>` : ""}
    </div>
    <p class="hint">Enter gross scores. The first tap of + sets par. Go below 1 for a pickup (P${isSF() ? ", 0 points" : ", counts as net double bogey"}). Red dots show strokes on this hole; highlighted scores are net birdie or better.</p>
    <button class="clear-btn" data-clear="1">Clear hole ${hole+1}</button>`;
}

function renderCard(){
  const sum = (p,a,z) => { let s = 0; for(let h=a; h<z; h++){ if(getS(p,h)===null) return ""; s += grossFor(p,h); } return s; };
  el("v-card").innerHTML = `
    <h2>Scorecard</h2>
    <p class="lede">Gross scores marked against par. Red dots show strokes received; shaded cells are net birdie or better. Tap a hole number to edit it.</p>
    ${LEGEND}
    <div class="scroll card"><table class="tbl">
      <thead>
        <tr><th>Hole</th>${Array.from({length:18},(_,h)=>`<th class="${h===9?"out":""}"><button class="hs" style="border:0;background:none;padding:0" data-edit="${h}">${h+1}</button></th>`).join("")}<th class="out">Out</th><th>In</th><th>Tot</th><th>${isSF() ? "Pts" : "Net"}</th></tr>
        <tr><th>Par</th>${PAR.map((x,h)=>`<th class="${h===9?"out":""}">${x}</th>`).join("")}<th class="out">36</th><th>36</th><th>72</th><th></th></tr>
        <tr><th>Hdcp</th>${SI.map((x,h)=>`<th class="${h===9?"out":""}">${x}</th>`).join("")}<th class="out"></th><th></th><th></th><th></th></tr>
      </thead>
      <tbody>
        ${active().map(pl => {
          const p = pl.pid, s = summary(p);
          const cells = Array.from({length:18},(_,h) => {
            const v = getS(p,h), pts = holePts(p,h), k = strokesFull(pl.h, SI[h]);
            return `<td class="${pts!==null&&pts>=3?"b":""} ${h===9?"out":""}">${scMark(v,h)}${k?`<sup>${"•".repeat(k)}</sup>`:""}</td>`;
          }).join("");
          return `<tr><td>${esc(shortName(pl))}</td>${cells}<td class="out strong">${sum(p,0,9)}</td><td class="strong">${sum(p,9,18)}</td><td class="strong">${s.thru===18?s.gross:""}</td><td class="strong">${s.thru ? (isSF() ? s.pts : toPar(s.ntp)) : ""}</td></tr>`;
        }).join("")}
      </tbody>
    </table></div>`;
}

function skinsAll(){
  const field = active();
  return Array.from({length:18}, (_,h) => {
    const entries = [];
    field.forEach(pl => {
      const g = getS(pl.pid,h);
      if(g === null || g === 0) return;
      const k = strokesSkin(pl.h, SI[h]);
      entries.push({p:pl.pid, pl, g, k, adj: g - 0.5 * k});
    });
    const done = field.length > 0 && field.every(pl => getS(pl.pid,h) !== null);
    if(!entries.length) return {h, state: done ? "dead" : "none", lead:[]};
    const low = Math.min(...entries.map(e => e.adj));
    const lead = entries.filter(e => e.adj === low);
    if(!done) return {h, state:"live", lead};
    return {h, state: lead.length === 1 ? "won" : "dead", lead};
  });
}
function renderSkins(){
  const res = skinsAll();
  const won = res.filter(r => r.state === "won"), dead = res.filter(r => r.state === "dead");
  const tally = {};
  won.forEach(r => { const e = r.lead[0]; tally[e.p] ??= {pl:e.pl, n:0, holes:[]}; tally[e.p].n++; tally[e.p].holes.push(r.h+1); });
  const rows = Object.values(tally).sort((a,b) => b.n - a.n || a.pl.n.localeCompare(b.pl.n));
  const sc = e => `gross ${e.g}${e.k ? `, counts ${e.adj}` : ""}`;
  el("v-skins").innerHTML = `
    <h2>Skins</h2>
    <p class="lede">Strokes capped at 18, so one stroke a hole at most. Each stroke takes 0.5 off the gross. Lowest adjusted score wins the skin; any tie and the hole dies. A hole is decided once every player has posted it.</p>
    <div class="skin-sum">
      <div><b>${won.length}</b><span>Skins won</span></div>
      <div><b>${dead.length}</b><span>Holes tied</span></div>
      <div><b>${18 - won.length - dead.length}</b><span>Still open</span></div>
    </div>
    <div class="skins">
      ${res.map(r => {
        const hd = `<div class="skin-hole">${r.h+1}<small>Par ${PAR[r.h]}, Hdcp ${SI[r.h]}</small></div>`;
        if(r.state === "none") return `<div class="skin-row">${hd}<div class="skin-detail">No scores yet</div><span class="tag live">Open</span></div>`;
        const e = r.lead[0];
        if(r.state === "won") return `<div class="skin-row">${hd}<div><div class="skin-who">${esc(e.pl.n)}</div><div class="skin-detail">${sc(e)}</div></div><span class="tag won">Skin</span></div>`;
        if(r.state === "dead") return `<div class="skin-row">${hd}<div><div class="skin-who">Tied</div><div class="skin-detail">${r.lead.map(x => esc(x.pl.n)).join(", ") || "All pickups"}</div></div><span class="tag dead">No skin</span></div>`;
        return `<div class="skin-row">${hd}<div><div class="skin-who">${r.lead.length === 1 ? esc(e.pl.n) : "Tied"}</div><div class="skin-detail">${r.lead.length === 1 ? sc(e) : r.lead.map(x => esc(x.pl.n)).join(", ")}, waiting on other groups</div></div><span class="tag live">Leading</span></div>`;
      }).join("")}
    </div>
    <h2>Skins by player</h2>
    ${rows.length ? `<div class="scroll"><table class="tbl">
      <thead><tr><th>Player</th><th>Holes</th><th>Skins</th></tr></thead>
      <tbody>${rows.map(x => `<tr><td>${esc(x.pl.n)}</td><td>${x.holes.join(", ")}</td><td class="strong">${x.n}</td></tr>`).join("")}</tbody>
    </table></div>` : `<p class="board-note">No skins won yet.</p>`}`;
}

function strokeHoles(h){
  if(h <= 18) return h ? `Hdcp holes 1–${h}` : "None";
  return `1 on every hole, 2 on Hdcp 1–${h - 18}`;
}
function renderHcp(){
  const sorted = active().sort((a,b) => a.h - b.h || a.n.localeCompare(b.n));
  const yrow = (a,z) => TEE_NAMES.map(t => TEES[t].y.slice(a,z).reduce((s,x)=>s+x,0));
  el("v-hcp").innerHTML = `
    <h2>Handicaps</h2>
    <div class="rules">
      <p>Stableford uses each player’s full handicap. Over 18 gets a second stroke on the hardest holes.</p>
      <p>Skins cap strokes at 18, so one stroke a hole at most, worth 0.5.</p>
    </div>
    <div class="scroll"><table class="tbl">
      <thead><tr><th>Player</th><th>Tees</th><th>Hcp</th><th>Stableford strokes</th><th>Skins strokes</th></tr></thead>
      <tbody>${sorted.map(pl => `<tr><td>${esc(pl.n)}</td><td>${teeBadge(pl.tee)}</td><td class="${hcClass(pl.h)}">${pl.h}</td><td>${strokeHoles(pl.h)}</td><td>${Math.min(pl.h,18)}</td></tr>`).join("")}</tbody>
    </table></div>
    <h2 style="margin-top:26px">Braelinn Country Club</h2>
    <p class="lede">${TEE_NAMES.map(t => `${t} ${TEES[t].r}`).join(", ")} (rating / slope)</p>
    <div class="scroll card"><table class="tbl">
      <thead><tr><th>Hole</th><th>Par</th><th>Hdcp</th>${TEE_NAMES.map(t => `<th>${teeBadge(t)}</th>`).join("")}</tr></thead>
      <tbody>
        ${PAR.map((x,h) => `${h===9?`<tr class="sum"><td>Out</td><td>36</td><td></td>${yrow(0,9).map(v=>`<td>${v}</td>`).join("")}</tr>`:""}<tr><td>${h+1}</td><td>${x}</td><td>${SI[h]}</td>${TEE_NAMES.map(t => `<td>${TEES[t].y[h]}</td>`).join("")}</tr>`).join("")}
        <tr class="sum"><td>In</td><td>36</td><td></td>${yrow(9,18).map(v=>`<td>${v}</td>`).join("")}</tr>
        <tr class="sum"><td>Total</td><td>72</td><td></td>${yrow(0,18).map(v=>`<td>${v}</td>`).join("")}</tr>
      </tbody>
    </table></div>`;
}

// ---- Setup tab ----
const teeSelect = (val, attrs) => `<select ${attrs}>${TEE_NAMES.map(t => `<option ${t===val?"selected":""}>${t}</option>`).join("")}</select>`;
function rosterNote(){
  return {
    local: `<p class="smsg bad">Device only: Supabase keys aren’t added, so roster changes stay on this phone.</p>`,
    loading: `<p class="smsg">Loading roster…</p>`,
    missing: `<p class="smsg bad">Roster table not found. Run the roster setup SQL in Supabase, then reload.</p>`,
    empty: `<p class="smsg">No players yet. Add this week’s field below.</p>`,
    ok: `<p class="smsg ok">Roster is live. Changes show on every phone.</p>`,
  }[rosterState];
}
function renderSetup(){
  if(!admin){
    el("v-setup").innerHTML = `
      <h2>Setup</h2>
      <p class="lede">Enter the PIN to manage players and run checks.</p>
      <div class="pin-box">
        <input id="pin" type="password" inputmode="numeric" autocomplete="off" aria-label="PIN" placeholder="PIN">
        <button class="sbtn primary" data-unlock="1">Unlock</button>
      </div>
      <p class="smsg bad" id="pin-msg"></p>`;
    return;
  }
  const act = active(), gone = roster.filter(r => !r.active).sort((a,b) => a.n.localeCompare(b.n));
  el("v-setup").innerHTML = `
    <h2>Setup</h2>
    ${rosterNote()}
    <div class="setup-card">
      <h3>Format</h3>
      <div class="row-btns" role="group" aria-label="Format" style="margin-top:0">
        ${Object.entries(FORMATS).map(([k,f]) => `<button class="sbtn ${fmt===k?"primary":""}" data-fmt="${k}" aria-pressed="${fmt===k}">${f.label}</button>`).join("")}
      </div>
      <p class="smsg">Changes the leaderboard on every phone right away. Skins stay the same in every format.</p>
      ${setupMsg.fmt ? `<p class="smsg bad">${esc(setupMsg.fmt)}</p>` : ""}
    </div>
    <div class="setup-card">
      <h3>Players (${act.length})</h3>
      ${act.map(pl => `<div class="srow">
        <input value="${esc(pl.n)}" data-f="n" data-pid="${pl.pid}" aria-label="Name">
        ${teeSelect(pl.tee, `data-f="tee" data-pid="${pl.pid}" aria-label="${esc(pl.n)} tees"`)}
        <input type="number" inputmode="numeric" min="0" max="54" value="${pl.h}" data-f="h" data-pid="${pl.pid}" aria-label="${esc(pl.n)} handicap">
        <button class="icon-btn" data-remove="${pl.pid}" aria-label="Remove ${esc(pl.n)}">✕</button>
      </div>`).join("")}
      <p class="smsg">Changes save when you leave a box. Removing a player hides them; their scores stay saved.</p>
    </div>
    <div class="setup-card">
      <h3>Add a player</h3>
      <div class="srow" style="grid-template-columns:1fr 84px 58px">
        <input id="add-n" placeholder="Name" aria-label="New player name">
        ${teeSelect("White", `id="add-tee" aria-label="New player tees"`)}
        <input id="add-h" type="number" inputmode="numeric" min="0" max="54" placeholder="Hcp" aria-label="New player handicap">
      </div>
      <div class="row-btns"><button class="sbtn primary" data-add="1">Add player</button></div>
      ${setupMsg.add ? `<p class="smsg ${setupMsg.addOk ? "ok" : "bad"}">${esc(setupMsg.add)}</p>` : ""}
    </div>
    ${gone.length ? `<div class="setup-card">
      <h3>Past players</h3>
      <p class="smsg" style="margin:-4px 0 6px">Tap Restore to add someone back. Check their tee and Hcp after.</p>
      ${gone.map(pl => `<div class="srow" style="grid-template-columns:1fr auto"><span>${esc(pl.n)} ${teeBadge(pl.tee)} ${pl.h}</span><button class="sbtn" data-restore="${pl.pid}">Restore</button></div>`).join("")}
    </div>` : ""}
    <div class="setup-card">
      <h3>Each week</h3>
      <p class="smsg" style="margin:-4px 0 6px">Start new week clears all scores and moves everyone to Past players, so you can add this week’s field.</p>
      <div class="row-btns">
        <button class="sbtn primary" data-test="1">Test sync</button>
        <button class="sbtn danger" data-clearall="1">Clear all scores</button>
        <button class="sbtn danger" data-newweek="1">Start new week</button>
      </div>
      ${setupMsg.test ? `<p class="smsg ${setupMsg.testOk ? "ok" : "bad"}">${esc(setupMsg.test)}</p>` : ""}
      ${setupMsg.clear ? `<p class="smsg">${esc(setupMsg.clear)}</p>` : ""}
    </div>
    <div class="row-btns"><button class="sbtn" data-lock="1">Lock setup</button></div>`;
}

async function testSync(){
  setupMsg.test = "Testing…"; setupMsg.testOk = false; render();
  if(!LIVE){ setupMsg.test = "Fail: Supabase keys aren’t added, so this page is device only."; render(); return; }
  const row = {course:EVENT_COURSE, team:"sob-test", player:9999, hole:99};
  try{
    let r = await db.from(TABLE).upsert({...row, gross:4, updated_at:new Date().toISOString()});
    if(r.error) throw new Error("score save failed: " + r.error.message);
    r = await db.from(TABLE).select("gross").match(row);
    if(r.error || !r.data.length || r.data[0].gross !== 4) throw new Error("score read-back failed");
    r = await db.from(TABLE).delete().match(row);
    if(r.error) throw new Error("score delete failed: " + r.error.message);
    const ro = await db.from(ROSTER).select("pid").eq("event", EVENT);
    if(ro.error) throw new Error("roster table not found");
    setupMsg.test = `Pass: scores save, read back and delete. Roster has ${ro.data.length} players.`;
    setupMsg.testOk = true;
  }catch(e){
    setupMsg.test = "Fail: " + e.message + ". Send Claude a screenshot.";
  }
  render();
}
async function newWeek(){
  const typed = prompt("Start a new week? This deletes every score and moves all players to Past players. Type NEW to confirm.");
  if(typed !== "NEW"){ setupMsg.clear = "Nothing changed."; render(); return; }
  if(LIVE){
    const del = await db.from(TABLE).delete().eq("course", EVENT_COURSE).eq("team", EVENT_TEAM);
    if(del.error){ setupMsg.clear = "Couldn’t clear scores: " + del.error.message; render(); return; }
    const off = await db.from(ROSTER).update({active:false, updated_at:new Date().toISOString()}).eq("event", EVENT).eq("active", true);
    if(off.error){ setupMsg.clear = "Scores cleared, but couldn’t reset players: " + off.error.message; render(); return; }
  }
  scores = {}; saveScores();
  roster.forEach(r => r.active = false); saveRosterLocal();
  group = []; store("sob-sat-group-v2", group); picking = true; openP = null;
  setupMsg.clear = "New week started. Add this week’s players above.";
  render();
}
async function clearAll(){
  const typed = prompt("This deletes every score for this event on all phones. Type CLEAR to confirm.");
  if(typed !== "CLEAR"){ setupMsg.clear = "Nothing cleared."; render(); return; }
  if(LIVE){
    const {error} = await db.from(TABLE).delete().eq("course", EVENT_COURSE).eq("team", EVENT_TEAM);
    if(error){ setupMsg.clear = "Couldn’t clear scores: " + error.message; render(); return; }
  }
  scores = {}; saveScores();
  setupMsg.clear = "All scores cleared. Ready for a new round.";
  render();
}
async function addPlayer(){
  const n = el("add-n").value.trim(), tee = el("add-tee").value, h = parseInt(el("add-h").value, 10);
  setupMsg.addOk = false;
  if(!n){ setupMsg.add = "Enter a name."; render(); return; }
  if(!Number.isInteger(h) || h < 0 || h > 54){ setupMsg.add = "Enter a handicap from 0 to 54."; render(); return; }
  const old = roster.find(r => r.n.toLowerCase() === n.toLowerCase());
  if(old && old.active){ setupMsg.add = `${n} is already on the list.`; render(); return; }
  let pl;
  if(old){ old.active = true; old.tee = tee; old.h = h; pl = old; }
  else { pl = {pid: Math.max(-1, ...roster.map(r => r.pid), ...Object.keys(scores).map(Number)) + 1, n, tee, h, active:true}; roster.push(pl); }
  if(await pushPlayer(pl)){ setupMsg.add = `Added ${n}.`; setupMsg.addOk = true; }
  render();
}

// ---- render ----
function render(){
  // Don't redraw Setup while someone is typing in it
  const f = document.activeElement;
  if(view === "setup" && f && el("v-setup").contains(f) && (f.tagName === "INPUT" || f.tagName === "SELECT")) return;
  el("subtitle").textContent = "Braelinn Country Club. " + FORMATS[fmt].short;
  document.querySelectorAll(".view-btn").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === view));
  ["board","enter","card","skins","hcp","setup"].forEach(v => el("v-"+v).hidden = v !== view);
  ({board:renderBoard, enter:renderEnter, card:renderCard, skins:renderSkins, hcp:renderHcp, setup:renderSetup})[view]();
}

document.addEventListener("change", async e => {
  const t = e.target; if(t.dataset.pid === undefined) return;
  const pl = byPid(+t.dataset.pid); if(!pl) return;
  if(t.dataset.f === "n"){ const v = t.value.trim(); if(!v){ t.value = pl.n; return; } pl.n = v; }
  if(t.dataset.f === "tee") pl.tee = t.value;
  if(t.dataset.f === "h"){ const v = parseInt(t.value, 10); if(!Number.isInteger(v) || v < 0 || v > 54){ t.value = pl.h; return; } pl.h = v; }
  setupMsg.add = "";
  await pushPlayer(pl);  // inputs already show the new value; other tabs redraw when opened
});
document.addEventListener("keydown", e => { if(e.key === "Enter" && e.target.id === "pin") document.querySelector("[data-unlock]")?.click(); });

document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.v){ view = b.dataset.v; render(); window.scrollTo(0,0); return; }
  if(b.dataset.open !== undefined){ const p = +b.dataset.open; openP = openP === p ? null : p; render(); return; }
  if(b.dataset.gp !== undefined){ const p = +b.dataset.gp; group = group.includes(p) ? group.filter(x => x !== p) : [...group, p]; store("sob-sat-group-v2", group); render(); return; }
  if(b.dataset.go){ picking = false; render(); return; }
  if(b.dataset.pick){ picking = true; render(); return; }
  if(b.dataset.step){ hole = Math.min(17, Math.max(0, hole + +b.dataset.step)); render(); return; }
  if(b.dataset.hole !== undefined){ hole = +b.dataset.hole; render(); return; }
  if(b.dataset.edit !== undefined){ hole = +b.dataset.edit; view = "enter"; render(); window.scrollTo(0,0); return; }
  if(b.dataset.clear){ group.filter(pid => byPid(pid)?.active).forEach(p => setS(p,hole,null)); render(); return; }
  if(b.dataset.p !== undefined){
    const p = +b.dataset.p, d = +b.dataset.d, cur = getS(p,hole);
    let next;
    if(cur === null) next = d > 0 ? PAR[hole] : null;
    else if(cur === 0) next = d > 0 ? 1 : null;
    else { next = cur + d; if(next > 12) next = 12; }
    setS(p,hole,next); render(); return;
  }
  // Setup
  if(b.dataset.unlock){
    if(el("pin").value === ADMIN_PIN){ admin = true; store("sob-admin", true); render(); }
    else el("pin-msg").textContent = "Wrong PIN.";
    return;
  }
  if(b.dataset.lock){ admin = false; store("sob-admin", false); render(); return; }
  if(b.dataset.add){ await addPlayer(); return; }
  if(b.dataset.remove !== undefined){
    const pl = byPid(+b.dataset.remove);
    if(!confirm(`Remove ${pl.n}? Their scores stay saved and come back if you restore them.`)) return;
    pl.active = false; if(openP === pl.pid) openP = null;
    await pushPlayer(pl); render(); return;
  }
  if(b.dataset.restore !== undefined){ const pl = byPid(+b.dataset.restore); pl.active = true; await pushPlayer(pl); render(); return; }
  if(b.dataset.test){ await testSync(); return; }
  if(b.dataset.clearall){ await clearAll(); return; }
  if(b.dataset.newweek){ await newWeek(); return; }
  if(b.dataset.fmt){ await pushFormat(b.dataset.fmt); return; }
});

render();
startSync();
</script>
</body>
